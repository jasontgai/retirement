# ============================================================
# nginx 리버스프록시 설정 — 은퇴설계 앱
# 위치: /etc/nginx/sites-available/retirement
# 활성화: sudo ln -s /etc/nginx/sites-available/retirement /etc/nginx/sites-enabled/
# SSL 발급: sudo certbot --nginx -d kairang.pe.kr
# ============================================================

# HTTP → HTTPS 강제 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name kairang.pe.kr;

    # Let's Encrypt 인증서 갱신용 경로 (certbot이 사용)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 메인 서버
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kairang.pe.kr;

    # SSL 인증서 (certbot 자동 발급 후 경로)
    ssl_certificate     /etc/letsencrypt/live/kairang.pe.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kairang.pe.kr/privkey.pem;

    # 권장 SSL 설정
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 보안 헤더
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 클라이언트 업로드 최대 크기
    client_max_body_size 10M;

    # ── Streamlit 프론트엔드 ──────────────────────────────────
    # WebSocket 필수 (Streamlit 실시간 통신)
    location / {
        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # WebSocket 업그레이드 헤더 (Streamlit 필수)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Streamlit long-poll: 타임아웃을 충분히 크게
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # ── FastAPI 백엔드 (OAuth 콜백 및 정적 파일) ─────────────
    # /api/ → localhost:9080/ (prefix 제거)
    location /api/ {
        proxy_pass         http://127.0.0.1:9080/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }

    # ── FastAPI auth 엔드포인트 (소셜 로그인 OAuth 콜백) ─────
    location /auth/ {
        proxy_pass         http://127.0.0.1:9080/auth/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30;
    }

    # 직접 접근 차단 페이지 (8501, 9080 포트로 오는 요청은 방화벽에서 차단)
    # iptables -A INPUT -p tcp --dport 8501 -j DROP
    # iptables -A INPUT -p tcp --dport 9080 -j DROP
}
